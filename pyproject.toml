[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-outcome"
version = "0.1.0"
description = "VERIFY · ASSERT · REPRODUCE — independent postcondition verification for AI agent side effects"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Jarvis Nelson Osorio Ramos", email = "jarvis@jarvisosorio.com" },
]
keywords = [
  "ai-agents",
  "verification",
  "assertions",
  "postconditions",
  "github",
  "postgresql",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "psycopg[binary]>=3.1",
]

[project.scripts]
agent-outcome = "agent_outcome.cli:main"

[project.urls]
Homepage = "https://github.com/JarvisOsorio/agent-outcome"
Repository = "https://github.com/JarvisOsorio/agent-outcome"
Issues = "https://github.com/JarvisOsorio/agent-outcome/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_outcome"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agent_outcome",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "live_github: optional live GitHub API tests (requires GITHUB_TOKEN + AGENT_OUTCOME_LIVE_GITHUB=1)",
  "live_postgres: optional live PostgreSQL tests (requires AGENT_OUTCOME_DATABASE_URL + AGENT_OUTCOME_LIVE_POSTGRES=1)",
]

[tool.coverage.run]
source = ["agent_outcome"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
